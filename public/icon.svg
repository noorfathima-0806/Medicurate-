<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0e2439" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Hexagonal Ring (Benzene Core Motif) -->
  <polygon points="256,76 396,156 396,316 256,396 116,316 116,156" 
           fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linejoin="round" opacity="0.85" filter="url(#glow)" />

  <!-- Medical Cross Geometry with Round Caps -->
  <rect x="226" y="146" width="60" height="180" rx="14" fill="url(#cyanGrad)" />
  <rect x="166" y="206" width="180" height="60" rx="14" fill="url(#cyanGrad)" />

  <!-- Central Atom / Pharmacophore Nucleus -->
  <circle cx="256" cy="236" r="30" fill="#ffffff" />
  <circle cx="256" cy="236" r="16" fill="#0284c7" />

  <!-- Molecular Satellites & Bonds -->
  <circle cx="256" cy="76" r="18" fill="url(#emeraldGrad)" />
  <circle cx="396" cy="156" r="18" fill="url(#emeraldGrad)" />
  <circle cx="396" cy="316" r="18" fill="url(#emeraldGrad)" />
  <circle cx="256" cy="396" r="18" fill="url(#emeraldGrad)" />
  <circle cx="116" cy="316" r="18" fill="url(#emeraldGrad)" />
  <circle cx="116" cy="156" r="18" fill="url(#emeraldGrad)" />

  <!-- Subtitle Text -->
  <text x="256" y="452" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="4">MEDCURATE</text>
  <text x="256" y="482" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" letter-spacing="2">VISUAL PHARMACOLOGY</text>
</svg>
